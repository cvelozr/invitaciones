<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Invitación</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fdf6f3;
      padding: 40px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      display: block;
margin: 0 auto;
      max-width: 400px; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn {
      background-color: #d68f8f;
      color: white;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      margin-top: 20px;
      width: 100%;
      max-width: 300px;
    }

    .btn:disabled {
      background-color: #ccc;
    }
  </style>
</head>

<body>

  
<div id="loginBox">
  <div class="card">
    <h2>🔐 Acceso para aceptar la invitación</h2>
    <input type="password" id="passwordInput" placeholder="Contraseña..." />
    <button class="btn" onclick="checkPassword()">Entrar</button>
    <p id="loginError" style="color:red;"></p>
    </div>
</div>

<div id="invBox" style="display:none;">
  <div class="card">
    <h2 id="mensaje">Cargando invitación...</h2>
    <p id="personas"></p>
    <p id="mesa"></p>
    <p id="estado"></p>
    <button class="btn" id="checkinBtn" style="display:none;">Ya llegué (Check-In)</button>
  </div>
</div>
